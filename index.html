<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campamento Vex'Halia</title>

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="app">

    <!-- ========= SIDEBAR ========= -->

    <aside class="sidebar">

        <div class="logo">

            <img src="images/logo.png" alt="Logo">

            <div>

                <h2>Vex'Halia</h2>

                <span>Campamento Oficial</span>

            </div>

        </div>

        <nav id="menu">

            <!-- El menú será generado por JavaScript -->

        </nav>

        <div class="sidebar-footer">

            <small>Versión 3.0</small>

        </div>

    </aside>

    <!-- ========= CONTENIDO ========= -->

    <main class="main">

        <!-- Barra superior -->

        <header class="topbar">

            <div class="topbar-left">

                <button id="btnMenu">

                    ☰

                </button>

                <h1 id="tituloPagina">

                    Inicio

                </h1>

            </div>

            <div class="topbar-right">

                <button id="btnNotificaciones">

                    🔔

                </button>

                <button id="btnAlexios">

                    🤖 Alexios

                </button>

                <div id="usuarioPanel">

                    Invitado

                </div>

            </div>

        </header>

        <!-- Dashboard -->

        <section id="contenido">

            <div class="dashboard">

                <div class="welcome-card">

                    <h2>

                        Bienvenido al Campamento Vex'Halia

                    </h2>

                    <p>

                        Sistema Oficial del Campamento.

                    </p>

                </div>

                <div class="dashboard-grid">

                    <div class="card">

                        <h3>👤 Usuario</h3>

                        <span id="cardUsuario">

                            Invitado

                        </span>

                    </div>

                    <div class="card">

                        <h3>📜 Personajes</h3>

                        <span id="cardPersonajes">

                            0

                        </span>

                    </div>

                    <div class="card">

                        <h3>🏛 Casa</h3>

                        <span id="cardCasa">

                            —

                        </span>

                    </div>

                    <div class="card">

                        <h3>📢 Noticias</h3>

                        <span id="cardNoticias">

                            Sin novedades

                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<!-- ========= MODAL ========= -->

<div id="modal" class="modal oculto">

    <div class="modal-content">

        <button id="cerrarModal">

            ✖

        </button>

        <div id="modalBody">

        </div>

    </div>

</div>

<!-- ========= LOADER ========= -->

<div id="loader" class="loader oculto">

    <div class="spinner"></div>

    <p>

        Cargando...

    </p>

</div>

<script type="module" src="js/app.js"></script>

</body>

</html>
