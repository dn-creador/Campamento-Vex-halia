<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campamento Vex'Halia</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}

body{

background:linear-gradient(#2d2116,#4b3825,#1c1712);
color:#f5e8c8;

}

header{

padding:40px 20px;
text-align:center;

background:rgba(0,0,0,.35);

border-bottom:3px solid gold;

}

header h1{

font-size:42px;

}

header p{

margin-top:10px;

font-size:18px;

color:#ddd;

}

.menu{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

padding:30px;

}

.card{

background:#efe2b5;

color:#3b2b1b;

border-radius:15px;

padding:25px;

text-align:center;

font-size:22px;

font-weight:bold;

cursor:pointer;

transition:.3s;

box-shadow:0 0 15px rgba(0,0,0,.4);

}

.card:hover{

transform:scale(1.05);

}

footer{

padding:30px;

text-align:center;

font-size:15px;

color:#ddd;

}

</style>

</head>

<body>

<header>

<h1>🏛️ CAMPAMENTO VEX'HALIA</h1>

<p>Los Archivos del Imperio te dan la bienvenida.</p>

</header>

<section class="menu">

<div class="card">🤖 Alexios</div>

<div class="card">📜 Registro</div>

<div class="card">🏛️ Casas Divinas</div>

<div class="card">⚔️ Poderes</div>

<div class="card">🎖️ Rangos</div>

<div class="card">🏪 Mercado</div>

<div class="card">📚 Biblioteca</div>

<div class="card">⚙️ Administración</div>

</section>

<footer>

Creado para Campamento Vex'Halia

</footer>

</body>
</html>
